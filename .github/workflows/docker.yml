name: Build and Push Docker Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  release:
    types:
      - published

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint with ruff
        run: ruff check app/ tests/

      - name: Check formatting with ruff
        run: ruff format --check app/ tests/

      - name: Run tests
        run: python -m pytest -q

      - name: Validate syntax
        run: python -c "import ast, glob; [ast.parse(open(f).read()) for f in glob.glob('app/*.py') + glob.glob('tests/*.py')]"

  publish:
    needs: [test]
    if: github.event_name == 'release' && github.event.action == 'published' && github.server_url != 'https://github.com'
    uses: l3tum/reusable-workflows/.github/workflows/publish-forgejo.yml@main
    runs-on: ubuntu-latest
    secrets:
      PACKAGE_TOKEN: ${{ secrets.PACKAGE_TOKEN }}
